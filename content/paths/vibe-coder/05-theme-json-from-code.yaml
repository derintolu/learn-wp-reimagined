id: vc-theme-json-from-code
title: Changing theme.json from your plugin
minutes: 8
landing: /hello-world/
sources:
  - title: Global settings and styles (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/global-settings-and-styles/
  - title: wp_theme_json_data_theme hook (Code Reference)
    url: https://developer.wordpress.org/reference/hooks/wp_theme_json_data_theme/
  - title: WP_Theme_JSON_Data::update_with() (Code Reference)
    url: https://developer.wordpress.org/reference/classes/wp_theme_json_data/update_with/
  - title: Filters for theme.json data (Make WordPress Core dev note)
    url: https://make.wordpress.org/core/2022/10/10/filters-for-theme-json-data/
  - title: Using Presets (Theme Handbook)
    url: https://developer.wordpress.org/themes/global-settings-and-styles/styles/using-presets/
  - title: Twenty Twenty-Five theme.json (WordPress core source)
    url: https://github.com/WordPress/wordpress-develop/blob/7.1/src/wp-content/themes/twentytwentyfive/theme.json
beats:
  - id: four-layers
    goal: See where a theme's look comes from, and where a plugin can step in.
    content: |
      Twenty Twenty-Five's colours, fonts and spacing live in its `theme.json` file. It has a palette of eight colours, with slugs like `base` (white), `contrast` (near black) and `accent-3` (a deep purple), and global styles that use them.

      WordPress builds the final settings and styles from four layers, each one able to override the one before:

      1. **default**, from WordPress itself
      2. **blocks**, from the blocks
      3. **theme**, from the theme's `theme.json`
      4. **user**, from changes made in the Site Editor

      Each layer has a filter: `wp_theme_json_data_default`, `wp_theme_json_data_blocks`, `wp_theme_json_data_theme` and `wp_theme_json_data_user`. A plugin that wants to adjust the theme's design uses `wp_theme_json_data_theme`, instead of editing the theme's file. Changes in the Site Editor still win, because the user layer comes last.
    question: Why is a filter better than editing Twenty Twenty-Five's theme.json directly?
  - id: the-filter
    goal: Write a callback for wp_theme_json_data_theme.
    content: |
      This filter doesn't hand your callback an array. It hands it an object, a `WP_Theme_JSON_Data`, holding the theme's data. You change it with the object's `update_with()` method, then **return the object**. Here's the pattern, with a callback that makes the site's body text Twenty Twenty-Five's grey, `accent-4`:

      ```php
      function my_first_plugin_grey_text( $theme_json ) {
      	$new_data = array(
      		'version' => 3,
      		'styles'  => array(
      			'color' => array(
      				'text' => 'var:preset|color|accent-4',
      			),
      		),
      	);

      	return $theme_json->update_with( $new_data );
      }
      add_filter( 'wp_theme_json_data_theme', 'my_first_plugin_grey_text' );
      ```

      `update_with()` merges your array into the theme's data and gives back the same object, so you can return its result straight away. `var:preset|color|accent-4` is theme.json's way of saying "the palette colour with the slug `accent-4`", so if the theme's grey ever changes, your text follows.

      It's still a filter, so the rule from lesson 1 holds. If your callback calls `update_with()` but returns nothing, or returns an array instead of the object (even `get_data()` of it), WordPress tries to call a method on what came back, and the page stops with a fatal error.
    question: What would you return if your callback decided not to change anything?
  - id: version-and-merging
    goal: Get the shape of the array right.
    content: |
      The array follows the same shape as `theme.json`, written as PHP arrays: `settings`, `styles`, and the keys inside them.

      **Always include `version`.** It's the theme.json schema version, so WordPress knows which shape your data is in and can update older shapes. Use `3`, the current one, which Twenty Twenty-Five uses too. Leave it out and WordPress throws your whole array away. Nothing changes, and nothing tells you why.

      Two kinds of data merge differently:

      - **Styles merge value by value.** Set one style and every other style in the theme stays as it was.
      - **Presets, like the colour palette, replace the theme's whole list.** Pass a palette with one colour and Twenty Twenty-Five's other seven are gone, along with every style that used them.

      That last one catches AI-written code all the time: it "adds" a colour and quietly wipes the theme's palette.
    question: An AI's callback sets a palette with just one new colour. What happens to the theme's eight?
  - id: your-turn
    goal: Change a style the theme really uses.
    content: |
      Twenty Twenty-Five doesn't set a colour for its headings, so they take the text colour. Your job: give every heading the theme's purple, `accent-3`, from your plugin.

      Styles for kinds of element, like links, buttons and headings, sit under `elements` in `styles`. Headings are `heading` (or `h1` to `h6` one at a time), and their colour goes in `color` > `text`, just like the body text in the example.

      Write it yourself in `my-first-plugin/my-first-plugin.php`: a callback on `wp_theme_json_data_theme`, with its own prefixed name, that calls `update_with()` with `version` 3 and that heading colour, and returns the data object. Choose **Apply to site** and the "Hello world!" title in your preview should turn purple.
    question: Where in the array does the heading colour go, compared with the body text in the example?
starterFiles:
  my-first-plugin/my-first-plugin.php: |
    <?php
    /**
     * Plugin Name: My First Plugin
     * Description: My first WordPress plugin, built with Learn WordPress, reimagined.
     * Version: 1.0.0
     * Requires at least: 6.6
     * Requires PHP: 7.4
     * Author: You
     * License: GPL v2 or later
     * License URI: https://www.gnu.org/licenses/gpl-2.0.html
     * Text Domain: my-first-plugin
     */

    if ( ! defined( 'ABSPATH' ) ) {
    	exit; // Stop if this file is opened directly, outside WordPress.
    }

    /**
     * Add a short thank-you note to the end of every post.
     */
    function my_first_plugin_add_note( $content ) {
    	$note = '<p class="my-first-plugin-note">Thanks for reading! This note was added by my first plugin.</p>';

    	// Greet the visitor by name when the link ends in ?reader=Something.
    	if ( isset( $_GET['reader'] ) ) {
    		$reader = sanitize_text_field( wp_unslash( $_GET['reader'] ) );
    		$note = '<p class="my-first-plugin-note">Thanks for reading, ' . esc_html( $reader ) . '! This note was added by my first plugin.</p>';
    	}

    	return $content . $note;
    }
    add_filter( 'the_content', 'my_first_plugin_add_note' );

    /**
     * Load the plugin's stylesheet on the front of the site.
     */
    function my_first_plugin_enqueue_styles() {
    	wp_enqueue_style( 'my-first-plugin', plugins_url( 'style.css', __FILE__ ), array(), '1.0.0' );
    }
    add_action( 'wp_enqueue_scripts', 'my_first_plugin_enqueue_styles' );
checkpoint:
  id: cp-theme-json-filter-code
  question: >-
    In my-first-plugin.php, add a callback on the wp_theme_json_data_theme filter that calls update_with() with
    version 3 and a style giving headings the accent-3 colour, and returns the data object.
  kind: code
  rubric: >-
    my-first-plugin.php hooks a callback with add_filter to wp_theme_json_data_theme (not the default, blocks
    or user layer). The callback calls update_with() on the WP_Theme_JSON_Data object it receives, with an
    array that has 'version' => 3 (2 is also fine, WordPress migrates it) and styles > elements > heading (or h1)
    > color > text set to var:preset|color|accent-3, and it returns that object (return
    $theme_json->update_with( ... ), or the object after calling update_with). Returning nothing, the array or
    get_data() (even chained, update_with( ... )->get_data()) fails. A typed signature or return type is fine. The the_content filter from lesson 1 is still there.
  file: my-first-plugin/my-first-plugin.php
  checks:
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: 'function\s+(\w+)\s*\([^)]*\)(?:\s*:\s*\??[\w\\]+)?\s*\{(?:(?!\bfunction\b)[\s\S])*?->\s*update_with\s*\([\s\S]*?\badd_filter\(\s*[''"]wp_theme_json_data_theme[''"]\s*,\s*[''"]\1[''"]|\badd_filter\(\s*[''"]wp_theme_json_data_theme[''"]\s*,\s*[''"](\w+)[''"][\s\S]*?function\s+\2\s*\([^)]*\)(?:\s*:\s*\??[\w\\]+)?\s*\{(?:(?!\bfunction\b)[\s\S])*?->\s*update_with\s*\(|\badd_filter\(\s*[''"]wp_theme_json_data_theme[''"]\s*,\s*(?:static\s+)?(?:function\s*\([^)]*\)\s*(?:use\s*\([^)]*\)\s*)?(?::\s*\??[\w\\]+\s*)?\{(?:(?!\bfunction\b)[\s\S])*?|fn\s*\([^)]*\)\s*(?::\s*\??[\w\\]+\s*)?=>\s*)\$\w+\s*->\s*update_with\s*\('
      message: Put the update_with() call inside a function, and hook that function with add_filter to wp_theme_json_data_theme. Check the function name in add_filter matches.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\breturn\s+\$(\w+)\s*->\s*update_with\s*\((?:(?!->)[^;])*;|\$(\w+)\s*->\s*update_with\s*\([\s\S]*?\breturn\s+\$\2\s*;|\bfn\s*\([^)]*\)\s*(?::\s*\??[\w\\]+\s*)?=>\s*\$\w+\s*->\s*update_with\s*\((?:(?!->)[^;])*;'
      message: Return the data object. Either return $theme_json->update_with( ... ) directly, or call update_with() and then return $theme_json. Returning nothing, or the array, stops the page with a fatal error.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '[''"]version[''"]\s*=>\s*(?:[''"]?[23][''"]?|WP_Theme_JSON::LATEST_SCHEMA)\s*[,)\]]'
      message: Include 'version' => 3 in the array. Without a version, WordPress throws the whole array away.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '[''"]styles[''"]\s*=>[\s\S]*?[''"]elements[''"]\s*=>[\s\S]*?[''"](?:heading|h1)[''"]\s*=>[\s\S]*?[''"]color[''"]\s*=>[\s\S]*?[''"]text[''"]\s*=>\s*[''"](?:var:preset\|color\|accent-3|var\(\s*--wp--preset--color--accent-3\s*\))[''"]'
      message: In the array, set styles > elements > heading > color > text to 'var:preset|color|accent-3'.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '^(?=[\s\S]*\bwp_theme_json_data_theme\b)[\s\S]*?\badd_filter\(\s*[''"]the_content[''"]'
      message: Keep your the_content filter from lesson 1 as you add the new filter. It still adds the note.
  branches:
    - outcome: advance
      to: vc-ship-it
      message: Your plugin now styles the theme, and a Site Editor change would still win. Last stop, getting your plugin ready to share.
    - outcome: review
      to: vc-theme-json-from-code
      message: Let's go back over update_with(), version and returning the object, then have another go.
    - outcome: skip
      to: vc-ship-it
      message: On to shipping your plugin.
  fallback:
    - label: Review the wp_theme_json_data_theme filter and update_with()
      outcome: review
