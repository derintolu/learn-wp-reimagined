title: Vibe coder
tagline: Ship WordPress code with an AI pair, and learn to spot what it gets wrong.
status: live
preview: { kind: plugin, slug: my-first-plugin }
placementHints: >-
  For people who build WordPress sites or code with an AI assistant (Claude, ChatGPT, Cursor, Copilot and so on)
  and paste in PHP they don't fully read or understand. It teaches plugin fundamentals by reading and fixing AI-written code.
  Start at vc-actions-and-filters if hooks, actions or filters are new to them, or if they are unsure.
  Start at vc-enqueueing if they can explain the difference between an action and a filter but have never loaded a stylesheet or script from a plugin.
  Start at vc-escaping-and-sanitizing if they write hooks and enqueue assets already and want to learn to secure input and output.
  Start at vc-template-hierarchy if they already escape output and sanitize input, but don't know how WordPress picks a template or what a plugin may change about it.
  Start at vc-theme-json-from-code if they know the template hierarchy and want to change a block theme's theme.json settings and styles from a plugin.
  Start at vc-ship-it only if they have built a plugin before and just want to get it ready to share.
# The finished reference plugin. The finale uses these files wherever a learner's own edit is missing or
# doesn't pass its lesson's checks. Must pass every lesson's checks (enforced by scripts/build-content.ts).
# Sources: docs/content-accuracy-vibe-coder.md, "Finale reference plugin".
finalFiles:
  my-first-plugin/my-first-plugin.php: |
    <?php
    /**
     * Plugin Name: My First Plugin
     * Description: My first WordPress plugin, built with Learn WordPress, reimagined.
     * Version: 1.0.0
     * Requires at least: 6.6
     * Requires PHP: 7.4
     * Author: You
     * License: GPL v2 or later
     * License URI: https://www.gnu.org/licenses/gpl-2.0.html
     * Text Domain: my-first-plugin
     */

    if ( ! defined( 'ABSPATH' ) ) {
    	exit; // Stop if this file is opened directly, outside WordPress.
    }

    /**
     * Add a short thank-you note to the end of every post.
     */
    function my_first_plugin_add_note( $content ) {
    	$note = '<p class="my-first-plugin-note">Thanks for reading! This note was added by my first plugin.</p>';

    	// Greet the visitor by name when the link ends in ?reader=Something.
    	if ( isset( $_GET['reader'] ) ) {
    		$reader = sanitize_text_field( wp_unslash( $_GET['reader'] ) );
    		$note = '<p class="my-first-plugin-note">Thanks for reading, ' . esc_html( $reader ) . '! This note was added by my first plugin.</p>';
    	}

    	return $content . $note;
    }
    add_filter( 'the_content', 'my_first_plugin_add_note' );

    /**
     * Load the plugin's stylesheet on the front of the site.
     */
    function my_first_plugin_enqueue_styles() {
    	wp_enqueue_style( 'my-first-plugin', plugins_url( 'style.css', __FILE__ ), array(), '1.0.0' );
    }
    add_action( 'wp_enqueue_scripts', 'my_first_plugin_enqueue_styles' );

    /**
     * Give the theme's headings the purple from its own palette.
     */
    function my_first_plugin_theme_json( $theme_json ) {
    	$new_data = array(
    		'version' => 3,
    		'styles'  => array(
    			'elements' => array(
    				'heading' => array(
    					'color' => array(
    						'text' => 'var:preset|color|accent-3',
    					),
    				),
    			),
    		),
    	);

    	return $theme_json->update_with( $new_data );
    }
    add_filter( 'wp_theme_json_data_theme', 'my_first_plugin_theme_json' );
  my-first-plugin/style.css: |
    /* Styles for My First Plugin. WordPress loads this file once the plugin enqueues it. */
    .my-first-plugin-note {
    	margin-top: 2rem;
    	padding: 1rem 1.25rem;
    	border-left: 4px solid #3858e9;
    	background: #eef1fd;
    }
# Read-only: the plugin every lesson's preview boots with, activated at boot. Just the header.
