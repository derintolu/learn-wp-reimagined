id: vc-escaping-and-sanitizing
title: Escaping output, sanitizing input
minutes: 8
landing: /hello-world/?reader=%3Cmark%3ESam%3C%2Fmark%3E
sources:
  - title: Securely developing plugins and themes (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/securely-developing-plugins-and-themes/
  - title: Security (Common APIs Handbook)
    url: https://developer.wordpress.org/apis/security/
  - title: Escaping data (Common APIs Handbook)
    url: https://developer.wordpress.org/apis/security/escaping/
  - title: Sanitizing data (Common APIs Handbook)
    url: https://developer.wordpress.org/apis/security/sanitizing/
  - title: esc_html() (Code Reference)
    url: https://developer.wordpress.org/reference/functions/esc_html/
  - title: sanitize_text_field() (Code Reference)
    url: https://developer.wordpress.org/reference/functions/sanitize_text_field/
  - title: wp_unslash() (Code Reference)
    url: https://developer.wordpress.org/reference/functions/wp_unslash/
beats:
  - id: never-trust-input
    goal: See why input from a visitor can't be trusted.
    content: |
      The first rule of WordPress security, straight from the handbook: **never trust user input**. Anything a visitor can type or change is input: form fields, cookies, and the part of a link after the `?`, called the **query string**.

      In PHP, the query string arrives in `$_GET`. For a link ending in `?reader=Sam`, `$_GET['reader']` is `Sam`. (Your plugin uses `reader` rather than `name`: WordPress already reads `?name=` itself, to find a post by its slug.) But anyone can make a link that says anything, and send it to your visitors.

      Two habits keep that safe:

      - **Sanitize** input as early as you can: clean it up when it comes in.
      - **Escape** output as late as you can: make it safe at the moment you put it on the page.
    question: What could someone put in a link's query string that you wouldn't want on your page?
  - id: escape-late
    goal: Escape data at the moment it goes on the page.
    content: |
      Escaping turns characters that mean something in HTML into harmless text. For text inside an HTML element, use `esc_html()`:

      ```php
      echo '<p>Hello, ' . esc_html( $reader ) . '</p>';
      ```

      If `$reader` is `<mark>Sam</mark>`, the visitor sees the tags as plain text, `<mark>Sam</mark>`, instead of the browser obeying them.

      There's an escaping function for each place data can go: `esc_attr()` inside an HTML attribute, `esc_url()` for links, `esc_textarea()` in a text area, and more.

      Escape **late**, right where the value is output, not earlier when you first get it. Then you can see at a glance that every output is safe, and nothing that changes the value later can undo it.
    question: Why is escaping at the output easier to check than escaping when the value first arrives?
  - id: sanitize-early
    goal: Clean input as soon as it arrives.
    content: |
      Sanitizing cleans input up as soon as it arrives. For a plain line of text, like a name, use `sanitize_text_field()`. It checks for invalid UTF-8, strips all HTML tags, removes line breaks, tabs and extra whitespace, and strips percent-encoded characters.

      ```php
      $reader = sanitize_text_field( wp_unslash( $_GET['reader'] ) );
      ```

      Why `wp_unslash()`? WordPress adds backslashes before quotes in `$_GET`, `$_POST` and `$_COOKIE`, so `O'Brien` arrives as `O\'Brien`. `wp_unslash()` takes them back out before you use the value.

      Sanitizing and escaping aren't either/or. Sanitize what comes in, escape what goes out, every time. Each catches what the other might miss.
    question: If sanitize_text_field() already strips tags, why escape the name again on output?
  - id: the-greeting
    goal: Read the AI's code like an attacker would.
    content: |
      An AI assistant has added a feature to your note: if the link has `?reader=` on the end, the note thanks the visitor by name. Your preview opens on a link that ends `?reader=<mark>Sam</mark>` (written in the address with `%3C` for `<` and so on).

      Read the code first, then look at the preview. If "Sam" comes out highlighted, the browser ran HTML that came from the link. A highlight is harmless, but a link with a `<script>` in it would run that too, on your site, for anyone who clicked it.
    question: In the AI's code, which line puts the visitor's input on the page?
starterFiles:
  my-first-plugin/my-first-plugin.php: |
    <?php
    /**
     * Plugin Name: My First Plugin
     * Description: My first WordPress plugin, built with Learn WordPress, reimagined.
     * Version: 1.0.0
     * Requires at least: 6.6
     * Requires PHP: 7.4
     * Author: You
     * License: GPL v2 or later
     * License URI: https://www.gnu.org/licenses/gpl-2.0.html
     * Text Domain: my-first-plugin
     */

    if ( ! defined( 'ABSPATH' ) ) {
    	exit; // Stop if this file is opened directly, outside WordPress.
    }

    /**
     * Add a short thank-you note to the end of every post.
     */
    function my_first_plugin_add_note( $content ) {
    	$note = '<p class="my-first-plugin-note">Thanks for reading! This note was added by my first plugin.</p>';

    	return $content . $note;
    }
    add_filter( 'the_content', 'my_first_plugin_add_note' );

    /**
     * Load the plugin's stylesheet on the front of the site.
     */
    function my_first_plugin_enqueue_styles() {
    	wp_enqueue_style( 'my-first-plugin', plugins_url( 'style.css', __FILE__ ), array(), '1.0.0' );
    }
    add_action( 'wp_enqueue_scripts', 'my_first_plugin_enqueue_styles' );
bug:
  id: bug-unescaped-name
  file: my-first-plugin/my-first-plugin.php
  code: |
    <?php
    /**
     * Plugin Name: My First Plugin
     * Description: My first WordPress plugin, built with Learn WordPress, reimagined.
     * Version: 1.0.0
     * Requires at least: 6.6
     * Requires PHP: 7.4
     * Author: You
     * License: GPL v2 or later
     * License URI: https://www.gnu.org/licenses/gpl-2.0.html
     * Text Domain: my-first-plugin
     */

    if ( ! defined( 'ABSPATH' ) ) {
    	exit; // Stop if this file is opened directly, outside WordPress.
    }

    /**
     * Add a short thank-you note to the end of every post.
     */
    function my_first_plugin_add_note( $content ) {
    	$note = '<p class="my-first-plugin-note">Thanks for reading! This note was added by my first plugin.</p>';

    	// Greet the visitor by name when the link ends in ?reader=Something.
    	if ( isset( $_GET['reader'] ) ) {
    		$reader = $_GET['reader'];
    		$note = '<p class="my-first-plugin-note">Thanks for reading, ' . $reader . '! This note was added by my first plugin.</p>';
    	}

    	return $content . $note;
    }
    add_filter( 'the_content', 'my_first_plugin_add_note' );

    /**
     * Load the plugin's stylesheet on the front of the site.
     */
    function my_first_plugin_enqueue_styles() {
    	wp_enqueue_style( 'my-first-plugin', plugins_url( 'style.css', __FILE__ ), array(), '1.0.0' );
    }
    add_action( 'wp_enqueue_scripts', 'my_first_plugin_enqueue_styles' );
  explanation: >-
    The note put $reader straight into the page with no escaping, so whatever was in the link's ?reader= went
    into your HTML as code. That's how "Sam" came out highlighted, and how a script could get in too.
    Wrapping it in esc_html() at the point of output turns the tags into plain text, so the preview now
    shows them as characters instead of obeying them. AI assistants often skip escaping when they build
    HTML from variables, so look for it whenever input ends up on the page. Your fixed file is now your plugin.
  fixChecks:
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\besc_html\(\s*\$reader\s*\)'
      message: Escape the name where it's put into the note's HTML. Text inside an HTML element needs esc_html().
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '^(?![\s\S]*(?:\.\s*\$reader\b|\$reader\s*\.(?!=)|"[^";\n]*\$reader\b[^";\n]*"))'
      message: Every place $reader goes into the note should be escaped. Look for a spot where it's joined into the HTML as it is.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\$_GET\[\s*[''"]reader[''"]\s*\]'
      message: Keep the greeting. Fix how the name is output rather than removing the feature.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\breturn\s*\(?\s*(?:\$content\s*\.\s*\$note|\$note\s*\.\s*\$content)\s*\)?\s*;|\$content\s*\.=\s*\$note\s*;[\s\S]*?\breturn\s*\(?\s*\$content\s*\)?\s*;'
      message: Keep returning the post's content with the note added, as you fixed it in lesson 1.
checkpoint:
  id: cp-sanitize-name-code
  question: >-
    Your output is escaped. Now sanitize the input too: in my-first-plugin.php, set $reader with
    sanitize_text_field(), unslashing $_GET['reader'] with wp_unslash() first, and keep esc_html() on the output.
  kind: code
  rubric: >-
    my-first-plugin.php still checks isset( $_GET['reader'] ), assigns $reader from sanitize_text_field() of
    $_GET['reader'] (wrapping it in wp_unslash() is recommended but not required), and still outputs it with
    esc_html( $reader ), with no unescaped use of $reader in the HTML.
  file: my-first-plugin/my-first-plugin.php
  checks:
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\$reader\s*=\s*sanitize_text_field\(\s*(?:wp_unslash\(\s*\$_GET\[\s*[''"]reader[''"]\s*\]\s*\)|\$_GET\[\s*[''"]reader[''"]\s*\])\s*\)'
      message: Set $reader from sanitize_text_field(), with $_GET['reader'] inside it (unslashed with wp_unslash() first).
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\besc_html\(\s*\$reader\s*\)'
      message: Keep esc_html() around $reader in the note. Sanitizing the input doesn't replace escaping the output.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '^(?![\s\S]*(?:\.\s*\$reader\b|\$reader\s*\.(?!=)|"[^";\n]*\$reader\b[^";\n]*"))'
      message: Every place $reader goes into the note should still be escaped with esc_html().
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\bisset\(\s*\$_GET\[\s*[''"]reader[''"]\s*\]\s*\)'
      message: Keep the isset() check, so the code only reads the name when the link has one.
  branches:
    - outcome: advance
      to: vc-escaping-and-sanitizing
      message: Sanitized on the way in, escaped on the way out. That's the habit that keeps a plugin safe.
    - outcome: review
      to: vc-escaping-and-sanitizing
      message: Let's go back over sanitizing and escaping, then have another go.
    - outcome: skip
      to: vc-escaping-and-sanitizing
      message: You've got the security basics. More lessons are on the way.
  fallback:
    - label: Review escaping and sanitizing
      outcome: review
