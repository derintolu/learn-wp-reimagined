id: vc-enqueueing
title: Loading CSS the WordPress way
minutes: 7
landing: /hello-world/
sources:
  - title: Enqueuing CSS or JavaScript (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/enqueuing-css-or-javascript/
  - title: Enqueuing (Plugin Handbook)
    url: https://developer.wordpress.org/plugins/javascript/enqueuing/
  - title: wp_enqueue_scripts hook (Code Reference)
    url: https://developer.wordpress.org/reference/hooks/wp_enqueue_scripts/
  - title: wp_enqueue_style() (Code Reference)
    url: https://developer.wordpress.org/reference/functions/wp_enqueue_style/
  - title: plugins_url() (Code Reference)
    url: https://developer.wordpress.org/reference/functions/plugins_url/
beats:
  - id: why-enqueue
    goal: Know why plugins enqueue their CSS instead of printing it.
    content: |
      Your note works, but it looks like every other paragraph. Your plugin has a stylesheet ready for it, `my-first-plugin/style.css`. Now WordPress has to load it.

      An AI assistant will sometimes write a `<link>` tag and `echo` it. Don't. WordPress builds the page's `<head>` itself, so plugins **enqueue** their files instead: you tell WordPress "this page needs this stylesheet", and WordPress prints the tag for you, once, in the right place.

      That pays off when several plugins and a theme all add files. WordPress knows every file by a name, called its **handle**, so it never loads the same one twice, and it can load a file after the ones it depends on.
    question: What could go wrong if two plugins each printed their own link tag for the same file?
  - id: the-right-hook
    goal: Pick the right hook for front-end files.
    content: |
      You enqueue from a callback on an action hook, and the hook depends on where the file is needed:

      - `wp_enqueue_scripts` for the front of the site, the pages visitors see. Despite its name, it's for **styles too**.
      - `admin_enqueue_scripts` for dashboard screens.
      - `login_enqueue_scripts` for the login page.

      Call `wp_enqueue_style()` loose in your plugin file and it runs far too early, before WordPress is ready: WordPress flags it as "doing it wrong". AI code often hooks it to `init` instead. That fires on every request, so your stylesheet would be queued for dashboard screens too, where your note never appears. `wp_enqueue_scripts` is the one built for this job.
    question: Your note only shows on posts. Which hook should load its stylesheet?
  - id: enqueue-a-style
    goal: Write the enqueue call.
    content: |
      `wp_enqueue_style()` takes a handle and the file's URL, plus optional extras:

      ```php
      wp_enqueue_style( $handle, $src, $deps, $ver, $media );
      ```

      - `$handle` is a unique name. Start it with your plugin's slug, like `my-first-plugin`.
      - `$src` is the file's full URL.
      - `$deps` lists handles to load first (default: none). `$ver` is added to the URL so browsers fetch a fresh copy when it changes. `$media` defaults to `all`.

      Don't type the URL out by hand: sites live at different addresses and folders. `plugins_url()` builds it for you. Give it a path and a file inside your plugin, usually `__FILE__` (PHP's name for "this file"), and it returns the URL relative to that file's folder:

      ```php
      plugins_url( 'style.css', __FILE__ )
      // https://example.com/wp-content/plugins/my-first-plugin/style.css
      ```

      The other form you'll often see, in AI-written code too, is `plugin_dir_url( __FILE__ ) . 'style.css'`. It gives the same URL: `plugin_dir_url()` returns your plugin's folder URL with a slash on the end.
    question: Why does plugins_url() need __FILE__ to find your stylesheet?
  - id: your-turn
    goal: Load the stylesheet yourself.
    content: |
      This one's yours to write, no AI this time. In `my-first-plugin/my-first-plugin.php`, add a function that enqueues `style.css`, and hook it to the right action. Choose **Apply to site** and the note in your preview should get a blue edge and a pale blue background.

      You can edit `style.css` too, if you'd like the note to look different.
    question: What will you call your function, so it can't clash with another plugin's?
starterFiles:
  my-first-plugin/my-first-plugin.php: |
    <?php
    /**
     * Plugin Name: My First Plugin
     * Description: My first WordPress plugin, built with Learn WordPress, reimagined.
     * Version: 1.0.0
     * Requires at least: 6.6
     * Requires PHP: 7.4
     * Author: You
     * License: GPL v2 or later
     * License URI: https://www.gnu.org/licenses/gpl-2.0.html
     * Text Domain: my-first-plugin
     */

    if ( ! defined( 'ABSPATH' ) ) {
    	exit; // Stop if this file is opened directly, outside WordPress.
    }

    /**
     * Add a short thank-you note to the end of every post.
     */
    function my_first_plugin_add_note( $content ) {
    	$note = '<p class="my-first-plugin-note">Thanks for reading! This note was added by my first plugin.</p>';

    	return $content . $note;
    }
    add_filter( 'the_content', 'my_first_plugin_add_note' );
  my-first-plugin/style.css: |
    /* Styles for My First Plugin. WordPress loads this file once the plugin enqueues it. */
    .my-first-plugin-note {
    	margin-top: 2rem;
    	padding: 1rem 1.25rem;
    	border-left: 4px solid #3858e9;
    	background: #eef1fd;
    }
checkpoint:
  id: cp-enqueue-style-code
  question: >-
    In my-first-plugin.php, add a function that loads style.css with wp_enqueue_style(), using
    plugins_url() and __FILE__ for its URL, and hook it to the action WordPress uses for front-end files.
  kind: code
  rubric: >-
    my-first-plugin.php has a callback hooked with add_action to wp_enqueue_scripts (not init, and not a
    loose call in the file), and inside it wp_enqueue_style() with a handle and plugins_url( 'style.css',
    __FILE__ ) (or plugin_dir_url( __FILE__ ) . 'style.css') as the source. The the_content filter from lesson 1 is still there.
  file: my-first-plugin/my-first-plugin.php
  checks:
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\bwp_enqueue_style\(\s*[''"][^''"]+[''"]\s*,\s*(?:plugins_url\(\s*[''"]/?style\.css[''"]\s*,\s*__FILE__\s*\)|plugin_dir_url\(\s*__FILE__\s*\)\s*\.\s*[''"]style\.css[''"])'
      message: Call wp_enqueue_style() with a handle, then the stylesheet's URL from plugins_url( 'style.css', __FILE__ ) (or plugin_dir_url( __FILE__ ) . 'style.css').
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: 'function\s+(\w+)\s*\([^)]*\)\s*\{(?:(?!\bfunction\b)[\s\S])*?\bwp_enqueue_style\s*\([\s\S]*?\badd_action\(\s*[''"]wp_enqueue_scripts[''"]\s*,\s*[''"]\1[''"]|\badd_action\(\s*[''"]wp_enqueue_scripts[''"]\s*,\s*[''"](\w+)[''"][\s\S]*?function\s+\2\s*\([^)]*\)\s*\{(?:(?!\bfunction\b)[\s\S])*?\bwp_enqueue_style\s*\(|\badd_action\(\s*[''"]wp_enqueue_scripts[''"]\s*,\s*(?:static\s+)?(?:function\s*\([^)]*\)\s*(?:use\s*\([^)]*\)\s*)?\{(?:(?!\bfunction\b)[\s\S])*?|fn\s*\([^)]*\)\s*=>\s*)\bwp_enqueue_style\s*\('
      message: Put the wp_enqueue_style() call inside a function, and hook that function with add_action to wp_enqueue_scripts (not init). Check the function name in add_action matches.
    - type: regex
      file: my-first-plugin/my-first-plugin.php
      pattern: '\badd_filter\(\s*[''"]the_content[''"]'
      message: Keep your the_content filter from the last lesson. It adds the note this stylesheet styles.
  branches:
    - outcome: advance
      to: vc-escaping-and-sanitizing
      message: Your stylesheet loads the WordPress way. Next, let's make sure your plugin can't be turned against your visitors.
    - outcome: review
      to: vc-enqueueing
      message: Let's go back over the hook and the enqueue call, then have another go.
    - outcome: skip
      to: vc-escaping-and-sanitizing
      message: On to escaping and sanitizing.
  fallback:
    - label: Review enqueueing and the wp_enqueue_scripts hook
      outcome: review
