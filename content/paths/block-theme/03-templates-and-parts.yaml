id: bt-templates-and-parts
title: Templates and template parts
minutes: 9
sources:
  - title: Introduction to Templates (Theme Handbook)
    url: https://developer.wordpress.org/themes/templates/introduction-to-templates/
  - title: Template Hierarchy (Theme Handbook)
    url: https://developer.wordpress.org/themes/templates/template-hierarchy/
  - title: Template Parts (Theme Handbook)
    url: https://developer.wordpress.org/themes/templates/template-parts/
  - title: Template overview (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/template-overview/
beats:
  - id: block-markup
    goal: Read block markup.
    content: |
      Templates are `.html` files in your theme's `templates/` folder, made entirely of block markup. Block markup is an HTML comment that WordPress reads as a block:

      ```html
      <!-- wp:namespace/slug {"align":"full"} /-->
      ```

      - `wp:` tells WordPress this is a block, not an ordinary comment.
      - `namespace/slug` names the block. Core blocks drop the `core/` namespace, so the Site Title block is just `<!-- wp:site-title /-->`. Blocks from plugins keep their namespace.
      - The JSON after it holds the block's settings.
      - A block with nothing inside ends with `/-->`. A block that wraps other blocks has an opening comment and a matching closing comment, such as `<!-- /wp:group -->`.

      You rarely type all of this by hand. Build the layout in the Site Editor, open the **Code editor** from the Options (⋮) menu, and copy the markup into your file. Keep everything as blocks: plain HTML that isn't wrapped in block markup shows up as an error in the Site Editor.
    question: What does the "wp:" at the start of a comment tell WordPress?
  - id: index-and-hierarchy
    goal: See how WordPress picks a template.
    content: |
      `index.html` is the only template a block theme must have. For each page, WordPress looks for the most specific template your theme has, such as `single.html` for a post, `page.html` for a page or `archive.html` for an archive. If there isn't one, it falls back to `index.html`.

      Your theme's `templates/index.html` lists posts with a Query Loop block. `"inherit":true` tells the loop to use the query WordPress already ran for the page, so the same template works for the blog, archives and search results:

      ```html
      <!-- wp:group {"tagName":"main","layout":{"type":"constrained"}} -->
      <main class="wp-block-group">
        <!-- wp:query {"query":{"inherit":true, ...}} -->
        <div class="wp-block-query">
          <!-- wp:post-template -->
            <!-- wp:post-title {"isLink":true} /-->
            <!-- wp:post-excerpt /-->
          <!-- /wp:post-template -->
        </div>
        <!-- /wp:query -->
      </main>
      <!-- /wp:group -->
      ```

      The Group block's `"tagName":"main"` makes it output a `<main>` element. A `"constrained"` layout keeps its contents to your `contentSize` from theme.json.
    question: If your theme only had index.html, which template would a single blog post use?
  - id: template-parts
    goal: Reuse a header with a template part.
    content: |
      A template part is a reusable piece of a template, like a header or footer. Parts live directly in your theme's `parts/` folder. Subfolders aren't supported.

      Your theme already has `parts/header.html`, with the site title and navigation:

      ```html
      <!-- wp:group {"layout":{"type":"flex","justifyContent":"space-between"}} -->
      <div class="wp-block-group">
        <!-- wp:site-title /-->
        <!-- wp:navigation /-->
      </div>
      <!-- /wp:group -->
      ```

      Unlike templates, parts are never loaded on their own. A template has to include them with the Template Part block:

      ```html
      <!-- wp:template-part {"slug":"header","tagName":"header"} /-->
      ```

      - `slug` is required. WordPress loads `parts/{slug}.html`, so `"header"` loads `parts/header.html`.
      - `tagName` sets the wrapping element, here `<header>`.

      You can also register parts in theme.json under the top-level `templateParts` key, with `name` (the file name without `.html`), `title` and `area`. WordPress 7.x has four built-in areas: `header`, `footer`, `uncategorized` (shown as "General") and `navigation-overlay` (shown as "Navigation Overlay", new in 7.0). Registering is optional, but it gives the part a proper label in the Site Editor.
    question: Why put the header in a part instead of copying it into every template?
  - id: editor-vs-files
    goal: Know where Site Editor changes go.
    content: |
      When you, or anyone using your theme, edits a template or part in the Site Editor and saves, the change is stored in the site's database. That saved copy then takes priority over the file in your theme.

      This is great for site owners, but it means the theme files don't change. To ship your design, the markup has to end up back in the theme's `templates/` and `parts/` files. You can copy it from the Code editor, or use the Create Block Theme plugin, covered in the last lesson.
    question: You edited the header in the Site Editor and saved. Has parts/header.html changed?
starterFiles:
  parts/header.html: |
    <!-- wp:group {"layout":{"type":"flex","justifyContent":"space-between"}} -->
    <div class="wp-block-group">
    	<!-- wp:site-title /-->
    	<!-- wp:navigation /-->
    </div>
    <!-- /wp:group -->
  templates/index.html: |
    <!-- wp:group {"tagName":"main","layout":{"type":"constrained"}} -->
    <main class="wp-block-group">
    	<!-- wp:query {"query":{"perPage":10,"pages":0,"offset":0,"postType":"post","order":"desc","orderBy":"date","author":"","search":"","exclude":[],"sticky":"","inherit":true}} -->
    	<div class="wp-block-query">
    		<!-- wp:post-template -->
    			<!-- wp:post-title {"isLink":true} /-->
    			<!-- wp:post-excerpt /-->
    		<!-- /wp:post-template -->

    		<!-- wp:query-pagination -->
    			<!-- wp:query-pagination-previous /-->
    			<!-- wp:query-pagination-next /-->
    		<!-- /wp:query-pagination -->

    		<!-- wp:query-no-results -->
    			<!-- wp:paragraph -->
    			<p>Nothing to show yet.</p>
    			<!-- /wp:paragraph -->
    		<!-- /wp:query-no-results -->
    	</div>
    	<!-- /wp:query -->
    </main>
    <!-- /wp:group -->
checkpoint:
  id: cp-header-part-code
  question: >-
    Your index.html has no header yet. Add a Template Part block at the very top that loads
    parts/header.html and wraps it in a header element.
  kind: code
  rubric: templates/index.html starts with a self-closing template-part block with slug "header" and tagName "header", above the Query Loop, which is still present.
  file: templates/index.html
  checks:
    - type: regex
      file: templates/index.html
      pattern: '<!--\s*wp:template-part\s+\{[^}]*"slug"\s*:\s*"header"[^}]*\}\s*/-->'
      message: Add a self-closing Template Part block. Its slug is the part's file name without .html.
    - type: regex
      file: templates/index.html
      pattern: '<!--\s*wp:template-part\s+\{(?=[^}]*"slug"\s*:\s*"header")(?=[^}]*"tagName"\s*:\s*"header")[^}]*\}\s*/-->'
      message: Choose the part's wrapping element with the tagName setting in the same block.
    - type: contains
      file: templates/index.html
      value: '<!-- wp:query '
      message: Keep the Query Loop that lists your posts.
    - type: regex
      file: templates/index.html
      pattern: '^\s*<!--\s*wp:template-part\s+\{[^}]*"slug"\s*:\s*"header"[^}]*\}\s*/-->[\s\S]*<main\b[\s\S]*<!--\s*wp:query\s'
      message: Put the header part at the very top of the file, before the main group and the posts.
  branches:
    - outcome: advance
      to: bt-global-styles
      message: Your theme has a header now. Next, let's style the whole thing from theme.json.
    - outcome: review
      to: bt-templates-and-parts
      message: Let's look at block markup and the Template Part block again, then have another go.
    - outcome: skip
      to: bt-global-styles
      message: On to global styles.
  fallback:
    - label: Review block markup and template parts
      outcome: review
