title: Block theme developer
tagline: Build your first block theme with theme.json, templates, parts and patterns.
status: live
preview: { kind: theme, slug: my-block-theme }
placementHints: >-
  For people who know some HTML and CSS and want to build a WordPress block theme.
  Start at bt-what-is-a-block-theme if block themes or theme.json are new to them, or if they are unsure.
  Start at bt-style-css-and-theme-json if they know what a block theme is but have never edited theme.json.
  Start at bt-templates-and-parts if they have edited theme.json settings but not written templates.
  Start at bt-global-styles if they have built templates and template parts and want to style the theme.
  Start at bt-patterns if they style themes in theme.json already and want to bundle patterns.
  Start at bt-ship-it only if they have built a block theme before and just want to export one.
# The finished reference theme. The finale ships these files wherever a learner's own
# edit is missing or doesn't pass its lesson's checks. Must pass every lesson's checks
# (enforced by scripts/build-content.ts). Sources: docs/content-accuracy.md, "Finale reference theme".
finalFiles:
  style.css: |
    /*
    Theme Name: My Block Theme
    Author: You
    Description: My first block theme, built with Learn WordPress, reimagined.
    Version: 1.0.0
    Requires at least: 6.6
    Tested up to: 7.1
    Requires PHP: 7.4
    License: GNU General Public License v2 or later
    License URI: https://www.gnu.org/licenses/gpl-2.0.html
    Text Domain: my-block-theme
    */
  theme.json: |
    {
      "$schema": "https://schemas.wp.org/trunk/theme.json",
      "version": 3,
      "settings": {
        "useRootPaddingAwareAlignments": true,
        "color": {
          "palette": [
            { "name": "Base", "slug": "base", "color": "#ffffff" },
            { "name": "Contrast", "slug": "contrast", "color": "#1e1e1e" },
            { "name": "Subtle", "slug": "subtle", "color": "#f0f0f0" },
            { "name": "Accent", "slug": "accent", "color": "#3858e9" }
          ]
        },
        "layout": {
          "contentSize": "40rem",
          "wideSize": "64rem"
        },
        "typography": {
          "fontFamilies": [
            {
              "name": "System Sans",
              "slug": "system-sans",
              "fontFamily": "system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
            }
          ]
        }
      },
      "styles": {
        "color": {
          "background": "var:preset|color|base",
          "text": "var:preset|color|contrast"
        },
        "spacing": {
          "padding": {
            "top": "0",
            "right": "1.5rem",
            "bottom": "0",
            "left": "1.5rem"
          }
        },
        "typography": {
          "fontFamily": "var:preset|font-family|system-sans",
          "lineHeight": "1.6"
        },
        "elements": {
          "link": {
            "color": { "text": "var:preset|color|accent" }
          },
          "heading": {
            "typography": { "fontWeight": "700", "lineHeight": "1.2" }
          }
        }
      },
      "templateParts": [
        { "name": "header", "title": "Header", "area": "header" },
        { "name": "footer", "title": "Footer", "area": "footer" }
      ]
    }
  templates/index.html: |
    <!-- wp:template-part {"slug":"header","tagName":"header"} /-->

    <!-- wp:group {"tagName":"main","layout":{"type":"constrained"}} -->
    <main class="wp-block-group">
    	<!-- wp:pattern {"slug":"my-block-theme/hero"} /-->

    	<!-- wp:query {"query":{"perPage":10,"pages":0,"offset":0,"postType":"post","order":"desc","orderBy":"date","author":"","search":"","exclude":[],"sticky":"","inherit":true}} -->
    	<div class="wp-block-query">
    		<!-- wp:post-template -->
    			<!-- wp:post-title {"isLink":true} /-->
    			<!-- wp:post-excerpt /-->
    		<!-- /wp:post-template -->

    		<!-- wp:query-pagination -->
    			<!-- wp:query-pagination-previous /-->
    			<!-- wp:query-pagination-next /-->
    		<!-- /wp:query-pagination -->

    		<!-- wp:query-no-results -->
    			<!-- wp:paragraph -->
    			<p>Nothing to show yet.</p>
    			<!-- /wp:paragraph -->
    		<!-- /wp:query-no-results -->
    	</div>
    	<!-- /wp:query -->
    </main>
    <!-- /wp:group -->

    <!-- wp:template-part {"slug":"footer","tagName":"footer"} /-->
  parts/header.html: |
    <!-- wp:group {"align":"full","style":{"spacing":{"padding":{"top":"1.25rem","bottom":"1.25rem"}}},"layout":{"type":"constrained"}} -->
    <div class="wp-block-group alignfull" style="padding-top:1.25rem;padding-bottom:1.25rem">
    	<!-- wp:group {"align":"wide","layout":{"type":"flex","justifyContent":"space-between"}} -->
    	<div class="wp-block-group alignwide">
    		<!-- wp:site-title /-->
    		<!-- wp:navigation /-->
    	</div>
    	<!-- /wp:group -->
    </div>
    <!-- /wp:group -->
  parts/footer.html: |
    <!-- wp:group {"align":"full","style":{"spacing":{"padding":{"top":"2rem","bottom":"2rem"}}},"layout":{"type":"constrained"}} -->
    <div class="wp-block-group alignfull" style="padding-top:2rem;padding-bottom:2rem">
    	<!-- wp:paragraph {"align":"center"} -->
    	<p class="has-text-align-center">Built with my own block theme.</p>
    	<!-- /wp:paragraph -->
    </div>
    <!-- /wp:group -->
  patterns/hero.php: |
    <?php
    /**
     * Title: Hero
     * Slug: my-block-theme/hero
     * Categories: featured
     */
    ?>
    <!-- wp:group {"tagName":"section","align":"full","backgroundColor":"subtle","style":{"spacing":{"padding":{"top":"3rem","bottom":"3rem"}}},"layout":{"type":"constrained"}} -->
