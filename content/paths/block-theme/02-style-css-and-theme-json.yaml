id: bt-style-css-and-theme-json
title: style.css and theme.json settings
minutes: 8
sources:
  - title: Main Stylesheet (style.css) (Theme Handbook)
    url: https://developer.wordpress.org/themes/basics/main-stylesheet-style-css/
  - title: Global settings and styles (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/global-settings-and-styles/
  - title: Color settings (Theme Handbook)
    url: https://developer.wordpress.org/themes/global-settings-and-styles/settings/color/
  - title: Layout settings (Theme Handbook)
    url: https://developer.wordpress.org/themes/global-settings-and-styles/settings/layout/
  - title: theme.json reference, version 3 (Block Editor Handbook)
    url: https://developer.wordpress.org/block-editor/reference-guides/theme-json-reference/theme-json-living/
beats:
  - id: style-css-header
    goal: Fill in the style.css header.
    content: |
      WordPress reads the comment at the top of `style.css` and shows it under **Appearance > Themes**. Here is your theme's header:

      ```css
      /*
      Theme Name: My Block Theme
      Author: You
      Description: My first block theme, built with Learn WordPress, reimagined.
      Version: 1.0.0
      Requires at least: 6.6
      Tested up to: 7.1
      Requires PHP: 7.4
      License: GNU General Public License v2 or later
      License URI: https://www.gnu.org/licenses/gpl-2.0.html
      Text Domain: my-block-theme
      */
      ```

      - `Theme Name` is the one that matters most. If it's missing, WordPress falls back to showing the folder name.
      - The WordPress.org Theme Directory requires the rest too: `Author`, `Description`, `Version`, `Requires at least`, `Tested up to`, `Requires PHP`, `License`, `License URI` and `Text Domain`.
      - `Requires at least: 6.6` is there because theme.json version 3 arrived in WordPress 6.6.

      You can still write CSS below the header, but WordPress doesn't load it on its own. A theme that needs it enqueues it from `functions.php`. In a block theme, most styling belongs in theme.json anyway.
    question: Which header line would you change first to make this theme yours?
  - id: settings-control-the-editor
    goal: See how settings shape the editor.
    content: |
      `settings` in theme.json decides what the editor offers. Two useful settings:

      - `settings.color.palette` is your list of colours, each with `name`, `slug` and `color`. They appear in every colour picker.
      - `settings.color.defaultPalette` set to `false` hides WordPress's own default colours, so people only see yours.

      Another is `settings.appearanceTools`. Set it to `true` and WordPress switches on a bundle of design controls in one go, including border, spacing (block gap, margin and padding), line height, and link, heading, button and caption colour controls.

      ```json
      "settings": {
        "appearanceTools": true,
        "color": {
          "defaultPalette": false,
          "palette": [ ... ]
        }
      }
      ```

      Settings don't change how anything looks by themselves. They decide which tools and presets are available. Styles (a later lesson) use them.
    question: Why might a theme hide the default palette?
  - id: layout-widths
    goal: Set the content and wide widths.
    content: |
      `settings.layout` holds two widths:

      - `contentSize` is the default width of content, such as the text of a post. For comfortable reading, aim for roughly 45 to 75 characters per line.
      - `wideSize` is the width of blocks set to "wide" alignment. It should be bigger than `contentSize`, but not the full screen, because "full" alignment already covers that.

      ```json
      "settings": {
        "layout": {
          "contentSize": "40rem",
          "wideSize": "64rem"
        }
      }
      ```

      Both take any CSS length, like `rem`, `px` or `%`. `layout` sits inside `settings`, next to `color`. It is not a top-level key.
    question: What would happen to reading comfort if contentSize were 100%?
starterFiles:
  theme.json: |
    {
      "$schema": "https://schemas.wp.org/trunk/theme.json",
      "version": 3,
      "settings": {
        "color": {
          "palette": [
            { "name": "Base", "slug": "base", "color": "#ffffff" },
            { "name": "Contrast", "slug": "contrast", "color": "#1e1e1e" },
            { "name": "Subtle", "slug": "subtle", "color": "#f0f0f0" }
          ]
        }
      }
    }
checkpoint:
  id: cp-settings-code
  question: >-
    Edit your theme.json. Add a fourth palette colour named Accent with the slug accent (any hex colour),
    then set the content width to 40rem and the wide width to 64rem.
  kind: code
  rubric: theme.json is valid JSON with version 3, a palette entry with name, slug "accent" and a hex color, and settings.layout contentSize 40rem and wideSize 64rem.
  file: theme.json
  checks:
    - type: json
      file: theme.json
      pointer: /version
      equals: 3
      message: theme.json must be valid JSON with version 3. Check commas between entries and keys.
    - type: regex
      file: theme.json
      pattern: '\{(?=[^{}]*"slug"\s*:\s*"accent")(?=[^{}]*"name"\s*:\s*"[^"]+")(?=[^{}]*"color"\s*:\s*"#[0-9a-fA-F]{3,8}")[^{}]*\}'
      message: Add a palette entry with the slug accent. Like the others, it needs a name, a slug and a color with a hex value.
    - type: json
      file: theme.json
      pointer: /settings/layout/contentSize
      equals: 40rem
      message: Set the content width. It lives in a layout object inside settings, not at the top level.
    - type: json
      file: theme.json
      pointer: /settings/layout/wideSize
      equals: 64rem
      message: Set the wide width next to the content width, inside the same layout object.
  branches:
    - outcome: advance
      to: bt-templates-and-parts
      message: Your settings are in. Now let's give the theme templates that use them.
    - outcome: review
      to: bt-style-css-and-theme-json
      message: Let's go back over palette entries and the layout widths, then try again.
    - outcome: skip
      to: bt-templates-and-parts
      message: On to templates and template parts.
  fallback:
    - label: Review palette entries and layout widths
      outcome: review
