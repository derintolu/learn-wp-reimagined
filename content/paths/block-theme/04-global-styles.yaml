id: bt-global-styles
title: Global styles in theme.json
minutes: 8
sources:
  - title: Styles (Theme Handbook)
    url: https://developer.wordpress.org/themes/global-settings-and-styles/styles/
  - title: Applying Styles (Theme Handbook)
    url: https://developer.wordpress.org/themes/global-settings-and-styles/styles/applying-styles/
  - title: Using Presets (Theme Handbook)
    url: https://developer.wordpress.org/themes/global-settings-and-styles/styles/using-presets/
  - title: Global settings and styles (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/global-settings-and-styles/
beats:
  - id: three-levels
    goal: Know the three levels you can style.
    content: |
      The top-level `styles` key in theme.json styles your theme at three levels:

      - **Root (global):** properties directly under `styles`, such as `styles.color`, apply to the `<body>` and cascade down to everything.
      - **Elements:** `styles.elements` targets things like links and buttons across every block.
      - **Blocks:** `styles.blocks` targets one block type, using its full name, such as `core/code`.

      ```json
      "styles": {
        "color": { "background": "#ffffff", "text": "#1e1e1e" },
        "elements": {
          "button": { "color": { "background": "#1e1e1e", "text": "#ffffff" } }
        },
        "blocks": {
          "core/code": { "color": { "background": "#f0f0f0" } }
        }
      }
      ```

      Styles set here show up in **Appearance > Editor > Styles**, so the people using your theme can change them without fighting CSS specificity. That's why the handbook recommends theme.json styles over a stylesheet wherever they can do the job.
    question: Where would you put a style that should apply to every link on the site?
  - id: elements
    goal: Style elements such as links and headings.
    content: |
      The elements you can style include:

      - `link` for `<a>` links
      - `button` for buttons and button-like links, such as the Button block
      - `heading` for all headings `<h1>` to `<h6>`, or `h1` through `h6` one at a time
      - `caption` for media captions, and `cite` for citations in quotes

      Links and buttons also accept pseudo-classes, nested under the element: `:hover`, `:focus`, `:active` and `:visited`.

      ```json
      "elements": {
        "link": {
          "color": { "text": "#3858e9" },
          ":hover": { "color": { "text": "#1e1e1e" } }
        }
      }
      ```

      If a block has its own style, it wins over the element style. For example, Button block styles override `elements.button`.
    question: What would you change to give links a different colour on hover?
  - id: presets-not-hex
    goal: Use your presets instead of hex codes.
    content: |
      Hard-coding `#1e1e1e` everywhere means editing every copy when the colour changes. Instead, point styles at the presets you registered in `settings`. theme.json has its own syntax for that:

      ```text
      var:preset|{feature}|{slug}
      ```

      So your `base` colour is `var:preset|color|base`:

      ```json
      "styles": {
        "color": {
          "background": "var:preset|color|base",
          "text": "var:preset|color|contrast"
        }
      }
      ```

      Behind the scenes, WordPress turns each preset into a CSS custom property, such as `--wp--preset--color--base`. In theme.json, use the `var:preset|…` form, because it shows up correctly in the Styles interface. Save the `var(--wp--preset--color--base)` form for when you're writing actual CSS.
    question: Why does referencing a preset make a later redesign easier?
starterFiles:
  theme.json: |
    {
      "$schema": "https://schemas.wp.org/trunk/theme.json",
      "version": 3,
      "settings": {
        "color": {
          "palette": [
            { "name": "Base", "slug": "base", "color": "#ffffff" },
            { "name": "Contrast", "slug": "contrast", "color": "#1e1e1e" },
            { "name": "Subtle", "slug": "subtle", "color": "#f0f0f0" },
            { "name": "Accent", "slug": "accent", "color": "#3858e9" }
          ]
        },
        "layout": {
          "contentSize": "40rem",
          "wideSize": "64rem"
        }
      }
    }
checkpoint:
  id: cp-global-styles-code
  question: >-
    Add a top-level styles section to your theme.json. Set the site background to your base colour, the text
    to your contrast colour, and every link to your accent colour. Use preset references, not hex codes.
  kind: code
  rubric: theme.json has styles.color.background "var:preset|color|base", styles.color.text "var:preset|color|contrast" and styles.elements.link.color.text "var:preset|color|accent", with version 3.
  file: theme.json
  checks:
    - type: json
      file: theme.json
      pointer: /version
      equals: 3
      message: theme.json must be valid JSON with version 3. styles goes next to settings, separated by a comma.
    - type: json
      file: theme.json
      pointer: /styles/color/background
      equals: var:preset|color|base
      message: The site background goes in a color object directly under styles. Point it at the base preset with the var:preset syntax.
    - type: json
      file: theme.json
      pointer: /styles/color/text
      equals: var:preset|color|contrast
      message: The text colour sits next to the background colour. Use the contrast preset.
    - type: json
      file: theme.json
      pointer: /styles/elements/link/color/text
      equals: var:preset|color|accent
      message: Links are an element, so they go under styles.elements, then link, then color. Use the accent preset.
  branches:
    - outcome: advance
      to: bt-patterns
      message: Your theme has a look of its own now. Next, let's give people a ready-made section to drop in.
    - outcome: review
      to: bt-global-styles
      message: Let's walk through styles levels and preset references again, then try once more.
    - outcome: skip
      to: bt-patterns
      message: On to block patterns.
  fallback:
    - label: Review styles and preset references
      outcome: review
