id: bt-what-is-a-block-theme
title: What makes a block theme
minutes: 4
sources:
  - title: Theme Structure (Theme Handbook)
    url: https://developer.wordpress.org/themes/core-concepts/theme-structure/
  - title: Theme structure (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/theme-structure/
  - title: Introduction to theme.json (Theme Handbook)
    url: https://developer.wordpress.org/themes/global-settings-and-styles/introduction-to-theme-json/
  - title: theme.json reference, version 3 (Block Editor Handbook)
    url: https://developer.wordpress.org/block-editor/reference-guides/theme-json-reference/theme-json-living/
beats:
  - id: blocks-all-the-way
    goal: See what makes a block theme different.
    content: |
      In a block theme, every part of the site is built from blocks: the header, the list of posts, the footer, all of it.

      Its templates are plain `.html` files full of **block markup**, which WordPress reads and turns into the page. For example, this one line outputs the site's title on any WordPress site:

      ```html
      <!-- wp:site-title /-->
      ```

      Because everything is blocks, people using your theme can change any of it visually in the Site Editor (**Appearance > Editor**). WordPress also writes the `<html>`, `<head>` and `<body>` tags for you, so your templates only describe what goes inside the page.
    question: Which part of a site would you most like to be able to change with blocks?
  - id: two-required-files
    goal: Know the two files every block theme needs.
    content: |
      WordPress needs just two files to recognise a block theme:

      - `style.css` in the theme's root folder. Its header comment holds the theme's details, such as its name and description.
      - `templates/index.html`. This is the default, fallback template. Having it is what makes WordPress treat the theme as a block theme.

      Everything else is optional, though most themes use more of it:

      ```text
      my-block-theme/
        parts/        reusable sections, like header.html
        patterns/     block patterns, registered automatically
        styles/       style variations (extra JSON files)
        templates/
          index.html  (required)
        style.css     (required)
        theme.json    settings and styles
      ```

      Some older tutorials say a block theme also needs `index.php`. Current WordPress doesn't: `style.css` plus `templates/index.html` is enough.
    question: If you deleted templates/index.html, what do you think WordPress would make of the theme?
  - id: meet-theme-json
    goal: Meet theme.json, the theme's control centre.
    content: |
      `theme.json` is optional, but almost every block theme has one. It has two main sections:

      - `settings` decides which controls and presets (such as a colour palette) the editor offers.
      - `styles` applies the theme's design, using those presets.

      Here is a small but complete `theme.json` with a three-colour palette:

      ```json
      {
        "$schema": "https://schemas.wp.org/trunk/theme.json",
        "version": 3,
        "settings": {
          "color": {
            "palette": [
              { "name": "Base", "slug": "base", "color": "#ffffff" },
              { "name": "Contrast", "slug": "contrast", "color": "#1e1e1e" },
              { "name": "Subtle", "slug": "subtle", "color": "#f0f0f0" }
            ]
          }
        }
      }
      ```

      - `version` is the schema version. **3** is current: it arrived in WordPress 6.6 and is still current in WordPress 7.1. (Some handbook pages still show `2`, an older version WordPress still accepts.)
      - `$schema` is optional. It lets your code editor check the file and suggest keys as you type.
      - Each palette entry takes exactly three keys: `name` (the label people see), `slug` (its ID) and `color` (the value). WordPress turns each entry into a CSS custom property, such as `--wp--preset--color--contrast`.

      One catch: WordPress doesn't warn you about a mistyped key. An entry without a `color` key is quietly skipped, with no error at all.
    question: Why might a typo in theme.json be harder to notice than a typo in CSS?
starterFiles:
  style.css: |
    /*
    Theme Name: My Block Theme
    Author: You
    Description: My first block theme, built with Learn WordPress, reimagined.
    Version: 1.0.0
    Requires at least: 6.6
    Tested up to: 7.1
    Requires PHP: 7.4
    License: GNU General Public License v2 or later
    License URI: https://www.gnu.org/licenses/gpl-2.0.html
    Text Domain: my-block-theme
    */
  theme.json: |
    {
      "$schema": "https://schemas.wp.org/trunk/theme.json",
      "version": 3,
      "settings": {
        "color": {
          "palette": [
            { "name": "Base", "slug": "base", "color": "#ffffff" },
            { "name": "Contrast", "slug": "contrast", "color": "#1e1e1e" },
            { "name": "Subtle", "slug": "subtle", "color": "#f0f0f0" }
          ]
        }
      }
    }
bug:
  id: bug-palette-value-key
  file: theme.json
  code: |
    {
      "$schema": "https://schemas.wp.org/trunk/theme.json",
      "version": 3,
      "settings": {
        "color": {
          "palette": [
            { "name": "Base", "slug": "base", "color": "#ffffff" },
            { "name": "Contrast", "slug": "contrast", "value": "#1e1e1e" },
            { "name": "Subtle", "slug": "subtle", "color": "#f0f0f0" }
          ]
        }
      }
    }
  explanation: >-
    The Contrast entry used "value" where theme.json expects "color". Palette entries take exactly
    "name", "slug" and "color", and WordPress reads each colour from "color". Without it, WordPress
    skips the entry, so no "--wp--preset--color--contrast" property is created, and nothing warns you.
    AI assistants make this kind of slip often, which is why it's worth checking their theme.json
    against the schema. Your fixed file is now your theme's theme.json.
  fixChecks:
    - type: notContains
      file: theme.json
      value: '"value"'
      message: Every palette entry should use the same three keys. Look for the entry that doesn't match the others.
    - type: json
      file: theme.json
      pointer: /settings/color/palette/1/color
      equals: '#1e1e1e'
      message: Keep the Contrast colour's hex code exactly as it was. Only the key around it is wrong.
    - type: json
      file: theme.json
      pointer: /settings/color/palette/1/color
      equals: '#1e1e1e'
      message: The file must still be valid JSON once the Contrast entry is fixed. Check for a missing comma or quote.
checkpoint:
  id: cp-two-files
  question: In a sentence or two, which two files does every block theme need, and what does each one do?
  kind: free-text
  rubric: >-
    Advance if the answer names both style.css (it holds the theme's details, such as its name, in a
    header comment) and templates/index.html (the default or fallback template, which makes WordPress
    treat the theme as a block theme). The roles can be described loosely. Review if it names only one
    of the two, names theme.json, functions.php or index.php as required, or is unsure. Skip only if
    the answer gets both right and also correctly explains extra detail, such as theme.json settings
    versus styles, or that theme.json is optional.
  branches:
    - outcome: advance
      to: bt-style-css-and-theme-json
      message: That's it. Next, you'll fill in style.css and give theme.json some real settings.
    - outcome: review
      to: bt-what-is-a-block-theme
      message: Let's go through the theme's anatomy once more. It's short, and everything else builds on it.
    - outcome: skip
      to: bt-templates-and-parts
      message: You clearly know your way around a theme already, so we'll skip ahead to templates and parts.
  fallback:
    - label: style.css holds the theme's details, and templates/index.html is the fallback template
      outcome: advance
    - label: theme.json and functions.php
      outcome: review
    - label: I'm not sure yet
      outcome: review
