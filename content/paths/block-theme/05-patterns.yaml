id: bt-patterns
title: Block patterns
minutes: 8
sources:
  - title: Introduction to Patterns (Theme Handbook)
    url: https://developer.wordpress.org/themes/patterns/introduction-to-patterns/
  - title: Registering Patterns (Theme Handbook)
    url: https://developer.wordpress.org/themes/patterns/registering-patterns/
  - title: Using Patterns in Templates (Theme Handbook)
    url: https://developer.wordpress.org/themes/patterns/usage-in-templates/
  - title: Theme Patterns (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/theme-patterns/
beats:
  - id: what-patterns-are
    goal: Understand what a pattern is.
    content: |
      A block pattern is a group of blocks set up in advance, ready to insert. Think of a hero section, a call to action or a row of team members. People pick them from the **Patterns** tab in the inserter, in posts, pages and templates.

      Every pattern your theme registers is **not synced**. When someone inserts it, they get their own copy of its blocks:

      - Editing the inserted blocks doesn't affect any other use of the pattern.
      - Changing the pattern file later doesn't change content that already used it.

      That's the big difference from a template part. Your header part is one shared piece, and editing it changes it everywhere. A pattern is a starting point that people make their own.
    question: Would you build a site footer as a pattern or a template part?
  - id: pattern-files
    goal: Register a pattern from a file.
    content: |
      Any PHP file in your theme's `patterns/` folder is registered automatically, as long as it has a valid header comment. Here's the start of `patterns/hero.php`:

      ```php
      <?php
      /**
       * Title: Hero
       * Slug: my-block-theme/hero
       * Categories: featured
       */
      ?>
      <!-- wp:group {"tagName":"section","align":"full","layout":{"type":"constrained"}} -->
      ...block markup...
      <!-- /wp:group -->
      ```

      - `Title` is the name people see in the inserter.
      - `Slug` is a unique ID in the form `namespace/pattern-name`. Use your theme's slug as the namespace.
      - `Categories` is a comma-separated list. It decides where the pattern appears in the inserter.

      WordPress won't register a pattern file without a `Title` and a `Slug`. It skips the file, and the only sign is a notice when debugging is on. The handbook recommends adding at least Title, Slug and Categories.

      Because pattern files are PHP, you can also make their text translatable, which template parts can't do.
    question: What would happen to a pattern file that had no Slug line?
  - id: patterns-in-templates
    goal: Use a pattern inside a template.
    content: |
      Templates and parts can include a pattern with the Pattern block, using the pattern's full slug:

      ```html
      <!-- wp:pattern {"slug":"my-block-theme/hero"} /-->
      ```

      You won't find the Pattern block in the inserter. It's meant for theme files. For example, `templates/index.html` could show the hero just below the header:

      ```html
      <!-- wp:template-part {"slug":"header","tagName":"header"} /-->

      <!-- wp:pattern {"slug":"my-block-theme/hero"} /-->
      ```

      Default themes lean on this. In Twenty Twenty-Five, the header and footer parts each contain just one Pattern block, and the index template's main content is two Pattern blocks.
    question: Why might a theme put a section in a pattern and then include it in a template?
starterFiles:
  patterns/hero.php: |
    <?php
    /**
     * Title: Hero
     * Slug: my-block-theme/hero
     * Categories: featured
     */
    ?>
    <!-- wp:group {"tagName":"section","align":"full","layout":{"type":"constrained"}} -->
    <section class="wp-block-group alignfull">
    	<!-- wp:heading {"level":1} -->
    	<h1 class="wp-block-heading">Hello from my block theme</h1>
    	<!-- /wp:heading -->

    	<!-- wp:paragraph -->
    	<p>This section is a pattern. Insert it from the Patterns tab and make it your own.</p>
    	<!-- /wp:paragraph -->
    </section>
    <!-- /wp:group -->
bug:
  id: bug-pattern-header
  file: patterns/hero.php
  code: |
    <?php
    /**
     * Name: Hero
     * Slug: my-block-theme/hero
     * Categories: featured
     */
    ?>
    <!-- wp:group {"tagName":"section","align":"full","layout":{"type":"constrained"}} -->
    <section class="wp-block-group alignfull">
    	<!-- wp:heading {"level":1} -->
    	<h1 class="wp-block-heading">Hello from my block theme</h1>
    	<!-- /wp:heading -->

    	<!-- wp:paragraph -->
    	<p>This section is a pattern. Insert it from the Patterns tab and make it your own.</p>
    	<!-- /wp:paragraph -->
    </section>
    <!-- /wp:group -->
  explanation: >-
    The header said "Name:" where WordPress looks for "Title:". WordPress reads pattern headers by field
    name, and a file without a Title isn't registered at all, so this pattern would never appear
    in the inserter. The only clue is a "Title field missing" notice when debugging is switched on.
  fixChecks:
    - type: regex
      file: patterns/hero.php
      pattern: '^\s*\*\s*Title:\s*\S'
      flags: mi
      message: WordPress reads the header by its field names. Compare each line with the fields the lesson lists.
    - type: regex
      file: patterns/hero.php
      pattern: '^\s*\*\s*Slug:\s*my-block-theme/hero\s*$'
      flags: m
      message: Keep the namespaced slug as it was.
checkpoint:
  id: cp-pattern-vs-part
  question: Your theme now has a template part (the header) and a pattern (the hero). In your own words, how does WordPress treat them differently?
  kind: free-text
  rubric: >-
    Advance if the answer captures the core difference: a template part is one shared section that
    templates include (via the Template Part block, from parts/), so changing it changes it everywhere;
    a theme pattern is a starting point people insert from the inserter, which gives them an independent
    copy of its blocks (not synced), so later edits don't affect other uses. Mentioning patterns/ PHP files
    or the header fields is a plus but not required. Review if the answer says they are the same, says
    theme patterns stay synced, or is unsure. Skip only if the answer is fully correct and adds accurate
    detail, such as patterns being PHP files that can hold translatable text, or the Pattern block in templates.
  branches:
    - outcome: advance
      to: bt-ship-it
      message: Exactly. Your theme is nearly done. Last stop, getting it out of the editor and into the world.
    - outcome: review
      to: bt-patterns
      message: Let's look at synced and not-synced once more. It's the key to choosing between the two.
    - outcome: skip
      to: bt-ship-it
      message: You've got this down. On to shipping your theme.
  fallback:
    - label: A part is shared everywhere it's used; an inserted pattern becomes an independent copy
      outcome: advance
    - label: They're the same thing with different file types
      outcome: review
    - label: I'm not sure yet
      outcome: review
