title: Learner
tagline: Start from zero and build your first WordPress site.
status: live
preview: { kind: site }
placementHints: >-
  For people who have never used WordPress, or have only looked around a site someone else set up.
  Start at ln-what-is-wordpress if WordPress or its dashboard is new to them, or if they are unsure.
  Start at ln-posts-and-pages if they can find their way around the dashboard but aren't sure when to use a post or a page.
  Start at ln-blocks if they have written posts and pages and want to understand blocks and the Code editor.
# The finished pages. The finale uses these wherever a learner's own edit is missing or doesn't pass
# its lesson's checks. Must pass every lesson's checks (enforced by scripts/build-content.ts).
# Sources: docs/content-accuracy-learner.md, "Finale reference pages".
finalFiles:
  pages/home.html: |
    <!-- wp:heading -->
    <h2 class="wp-block-heading">Welcome to my new site</h2>
    <!-- /wp:heading -->

    <!-- wp:paragraph -->
    <p>I'm building this site one lesson at a time. Have a look around.</p>
    <!-- /wp:paragraph -->
  pages/about.html: |
    <!-- wp:paragraph -->
    <p>Hi there. This is my first WordPress site, and I'm building it myself.</p>
    <!-- /wp:paragraph -->

    <!-- wp:paragraph -->
    <p>I'm learning as I go, so expect it to change a lot.</p>
    <!-- /wp:paragraph -->

    <!-- wp:heading -->
    <h2 class="wp-block-heading">What I'm working on</h2>
    <!-- /wp:heading -->

    <!-- wp:paragraph -->
    <p>Right now, I'm learning how blocks work.</p>
    <!-- /wp:paragraph -->

# Read-only: the front page every lesson's preview starts with. pages/home.html becomes the static front page.
previewFiles:
