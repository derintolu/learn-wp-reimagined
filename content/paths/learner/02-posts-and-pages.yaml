id: ln-posts-and-pages
title: Posts and pages, and when to use which
minutes: 5
landing: /wp-admin/edit.php?post_type=page
sources:
  - title: Understanding the difference between WordPress posts and pages (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/understanding-the-difference-between-wordpress-posts-and-pages/
  - title: Getting started with the WordPress dashboard (Learn WordPress lesson)
    url: https://learn.wordpress.org/lesson/getting-started-with-the-wordpress-dashboard/
  - title: Create pages (WordPress documentation)
    url: https://wordpress.org/documentation/article/create-pages/
  - title: Administration Screens (WordPress documentation)
    url: https://wordpress.org/documentation/article/administration-screens/
beats:
  - id: posts-are-timely
    goal: Know what posts are for.
    content: |
      **Posts** are for content you add regularly and that belongs to a moment in time: blog articles, news, reviews, recipes.

      - They're listed newest first on your blog page.
      - Each one has a date, and you can publish it straight away, save it as a draft, or schedule it for later.
      - You can sort them with **categories** (broad groups, like the table of contents of your blog) and **tags** (more specific keywords).
      - They're included in your site's feeds, so people who follow your site hear about new ones.
    question: Think of a site you visit often. What on it would be a post?
  - id: pages-are-timeless
    goal: Know what pages are for.
    content: |
      **Pages** are for content that stays put and is always relevant: Home, About, Contact, Services, a privacy policy.

      - They aren't listed by date with your posts. Each one stands on its own.
      - They don't have categories or tags. Instead, you can organise them into **parent pages and subpages**, like an About page with a Careers page under it.
      - They aren't included in your site's feeds.
      - You'll usually add them to your site's navigation menu, so visitors can find them.

      Both are edited the same way, with blocks. The difference is what the content is for, not how you write it.
    question: Would a page called "Our team" ever need a date on it? Why or why not?
  - id: your-pages-screen
    goal: Find your way around the Pages screen.
    content: |
      The preview is open at **Pages**, which lists every page on the site. You'll see a few that WordPress or this course made for you, including one called **Home**.

      - Hover over a page's title to get links to **Edit**, **Quick Edit**, **Trash** and **View**. (In a narrow window, like the preview, tap the arrow at the end of the row instead.)
      - **Quick Edit** changes things like the title, the slug (the page's part of the address) or the parent page, without opening the editor.
      - Trashed pages can be restored for up to 30 days.

      **Home** is marked as the **Front Page**. That's a site-wide setting, under **Settings > Reading**, which decides whether your front page shows your latest posts or a page you choose. This site shows a page.
    question: Why might a small business want a page as its front page, rather than its latest posts?
checkpoint:
  id: cp-post-or-page
  question: >-
    You're making a site for a local bakery. Would "Opening hours" be a post or a page? What about
    "Pumpkin loaves are back for October"? Say why for each.
  kind: free-text
  rubric: >-
    Advance if the answer makes "Opening hours" a page (it is lasting information that doesn't belong
    to a date) and "Pumpkin loaves are back for October" a post (it is timely news tied to a date), with
    a reason for each that is roughly right. Review if either is the wrong way round, both are the same
    type, the reasons are missing or wrong, or the learner is unsure. Skip only if both are right and the
    answer also correctly brings in another difference, such as categories and tags for posts, parent
    pages, posts being listed newest first, or feeds.
  branches:
    - outcome: advance
      to: ln-blocks
      message: That's the idea. Next, let's look at the blocks you'll build every post and page from.
    - outcome: review
      to: ln-posts-and-pages
      message: Let's go over posts and pages once more. The quick test is whether the content belongs to a date.
    - outcome: skip
      to: ln-blocks
      message: You've got posts and pages sorted. On to blocks.
  fallback:
    - label: Opening hours is a page, and the pumpkin loaves news is a post
      outcome: advance
    - label: Both are posts
      outcome: review
    - label: I'm not sure yet
      outcome: review
