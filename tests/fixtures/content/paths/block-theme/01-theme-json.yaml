id: theme-json-basics
title: theme.json basics
minutes: 10
sources:
  - title: Introduction to theme.json
    url: https://developer.wordpress.org/themes/global-settings-and-styles/
beats:
  - id: why
    goal: Understand why theme.json is the control centre of a block theme.
    content: |
      `theme.json` declares your palette, typography and layout in one file.
    question: What would you put in theme.json instead of CSS?
  - id: palette
    goal: Add a colour palette.
    content: |
      Colours live under `settings.color.palette`.
checkpoint:
  id: cp-theme-json
  question: In your own words, what does the settings section of theme.json do?
  kind: free-text
  rubric: A good answer says settings configure which editor controls and presets are available.
  branches:
    - { outcome: advance, to: templates-and-parts, message: Nice. On to templates. }
    - { outcome: review, to: theme-json-basics, message: Let's look at settings once more. }
    - { outcome: skip, to: templates-and-parts, message: Skipping ahead to templates. }
  fallback:
    - { label: Settings control editor options and presets, outcome: advance }
    - { label: I'm not sure yet, outcome: review }
