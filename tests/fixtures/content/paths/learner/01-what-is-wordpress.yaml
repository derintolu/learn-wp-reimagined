id: ln-what-is-wordpress
title: What WordPress is
minutes: 5
sources:
  - title: Introduction to WordPress
    url: https://learn.wordpress.org/lesson/introduction-to-wordpress-2/
beats:
  - id: what
    goal: Know what WordPress is.
    content: |
      WordPress is a content management system for building websites.
    question: What kind of site would you like to build?
checkpoint:
  id: cp-dashboard-tour
  question: Which part of the dashboard would you use to upload a photo?
  kind: free-text
  rubric: Advance if the answer names Media.
  branches:
    - { outcome: advance, to: ln-posts-and-pages, message: Nice. On to posts and pages. }
    - { outcome: review, to: ln-what-is-wordpress, message: Let's look at the menu once more. }
    - { outcome: skip, to: ln-posts-and-pages, message: Skipping ahead. }
  fallback:
    - { label: Media, outcome: advance }
    - { label: I'm not sure yet, outcome: review }
