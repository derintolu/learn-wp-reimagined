placementHints: >-
  For people who have never used WordPress, or have only looked around a site someone else set up.
  Pick this path for anyone who has never used WordPress and does not write code, even if they mention themes or plugins as a someday goal.
  Start at ln-what-is-wordpress if WordPress or its dashboard is new to them, or if they are unsure.
  Start at ln-posts-and-pages if they can find their way around the dashboard but aren't sure when to use a post or a page.
