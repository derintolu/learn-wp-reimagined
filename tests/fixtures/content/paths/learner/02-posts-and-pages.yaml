id: ln-posts-and-pages
title: Posts and pages
minutes: 8
sources:
  - title: Posts and pages
    url: https://wordpress.org/documentation/article/post-vs-page/
beats:
  - id: difference
    goal: Know when to use a page.
    content: |
      Pages hold content that does not change often, like an About page.
starterFiles:
  pages/about.html: |
    <!-- wp:paragraph -->
    <p>Hi there.</p>
    <!-- /wp:paragraph -->
checkpoint:
  id: cp-about-page
  question: Add a heading block to the About page.
  kind: code
  rubric: The About page has a heading block.
  file: pages/about.html
  checks:
    - { type: contains, file: pages/about.html, value: 'wp:heading', message: Add a heading block. }
  branches:
    - { outcome: advance, to: ln-posts-and-pages, message: Your About page looks right. }
    - { outcome: review, to: ln-posts-and-pages, message: Let's revisit the editor. }
    - { outcome: skip, to: ln-posts-and-pages, message: Moving on. }
  fallback:
    - { label: Show me the answer, outcome: review }
    - { label: Skip this one, outcome: skip }
bug:
  id: bug-about-heading
  file: pages/about.html
  code: |
    <!-- wp:heading -->
    <h2>About me</h3>
    <!-- /wp:heading -->
  explanation: The heading opens with h2 but closes with h3.
  fixChecks:
    - { type: regex, file: pages/about.html, pattern: '<h2[^>]*>[^<]*</h2>', message: Close the heading with h2. }
